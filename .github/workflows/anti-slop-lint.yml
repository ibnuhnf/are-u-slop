name: Anti-Slop Code Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Anti-Slop Linter (Node)
        run: node scripts/check-slop.mjs
      - name: Validate Dataset & Tokens (Python)
        run: python scripts/validate_dataset.py
